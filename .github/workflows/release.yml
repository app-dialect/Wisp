name: Release DMG

# Run from the Actions tab, or push a v* tag. Beta tags become pre-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.0-beta
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build DMG
        run: ./build.sh dmg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          shasum -a 256 build/*.dmg > build/checksums.txt
          PRE=""; [[ "$TAG" == *beta* || "$TAG" == *alpha* ]] && PRE="--prerelease"
          gh release create "$TAG" build/*.dmg build/checksums.txt $PRE \
            --title "Wisp $TAG" --notes-file CHANGELOG.md
